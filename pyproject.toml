[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qk-tool"
version = "0.1.1"
description = "A multi-OS CLI Swiss army knife for daily computer tasks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Efe Borazan" }]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pyperclip>=1.8.0",
    "requests>=2.28.0",
]

[project.scripts]
qk = "qk.cli:app_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
